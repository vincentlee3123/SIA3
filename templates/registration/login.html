{% extends "base.html" %}
{% block title %}Log In{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="auth-wrap">
        <div class="pms-card p-4 p-md-5">
            <div class="auth-logo"><i class="bi bi-heart-pulse"></i></div>
            <h1 class="h3 text-center fw-bold mb-1">Welcome back</h1>
            <p class="text-center text-muted mb-4">Log in to manage your pet records.</p>

            {% if form.errors %}
            <div class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-1"></i>Invalid username or password.
            </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                <div class="mb-3">
                    <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" id="{{ form.username.id_for_label }}"
                               class="form-control" value="{{ form.username.value|default:'' }}"
                               autocomplete="username" autofocus required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" id="{{ form.password.id_for_label }}"
                               class="form-control" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Log In
                </button>
            </form>

            <p class="text-center text-muted mt-4 mb-0">
                No account? <a href="{% url 'signup' %}" class="fw-semibold text-decoration-none">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
